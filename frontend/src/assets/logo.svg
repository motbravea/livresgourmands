<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Chef hat -->
  <g transform="translate(100 38)">
    <path d="M -22 24 C -22 4 -14 -10 0 -10 C 14 -10 22 4 22 24 L 22 28 L -22 28 Z"
          fill="none" stroke="#c9a961" stroke-width="2.6" stroke-linejoin="round"/>
    <ellipse cx="-13" cy="2" rx="9" ry="11" fill="none" stroke="#c9a961" stroke-width="2.6"/>
    <ellipse cx="0" cy="-3" rx="10" ry="13" fill="none" stroke="#c9a961" stroke-width="2.6"/>
    <ellipse cx="13" cy="2" rx="9" ry="11" fill="none" stroke="#c9a961" stroke-width="2.6"/>
    <rect x="-22" y="26" width="44" height="6" rx="1" fill="none" stroke="#c9a961" stroke-width="2.4"/>
  </g>

  <!-- Steam -->
  <path d="M 100 78 C 96 86 104 92 100 100 C 96 108 104 114 100 120"
        stroke="#c9a961" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Spoon -->
  <g transform="translate(82 78)" fill="#c9a961">
    <ellipse cx="0" cy="0" rx="7" ry="10"/>
    <rect x="-2" y="8" width="4" height="38" rx="2"/>
  </g>

  <!-- Fork -->
  <g transform="translate(118 78)" fill="#c9a961">
    <rect x="-2" y="8" width="4" height="38" rx="2"/>
    <rect x="-7" y="-10" width="2.4" height="18" rx="1"/>
    <rect x="-2.2" y="-10" width="2.4" height="18" rx="1"/>
    <rect x="2.6" y="-10" width="2.4" height="18" rx="1"/>
    <rect x="-8" y="6" width="16" height="4" rx="1.5"/>
  </g>

  <!-- Open book base -->
  <g>
    <!-- Left pages -->
    <path d="M 100 150
             C 80 138 50 132 24 138
             L 30 168
             C 56 162 82 166 100 178 Z"
          fill="#faf7f2" stroke="#1f4d3a" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M 32 148 C 56 142 80 146 98 156" stroke="#1f4d3a" stroke-width="1.2" fill="none" opacity="0.45"/>
    <path d="M 36 158 C 58 152 80 156 98 164" stroke="#1f4d3a" stroke-width="1.2" fill="none" opacity="0.35"/>

    <!-- Right pages -->
    <path d="M 100 150
             C 120 138 150 132 176 138
             L 170 168
             C 144 162 118 166 100 178 Z"
          fill="#faf7f2" stroke="#1f4d3a" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M 168 148 C 144 142 120 146 102 156" stroke="#1f4d3a" stroke-width="1.2" fill="none" opacity="0.45"/>
    <path d="M 164 158 C 142 152 120 156 102 164" stroke="#1f4d3a" stroke-width="1.2" fill="none" opacity="0.35"/>

    <!-- Center spine -->
    <path d="M 100 150 L 100 178" stroke="#1f4d3a" stroke-width="2.4" stroke-linecap="round"/>
  </g>
